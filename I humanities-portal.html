<style>

/* level-3 */
.qs{margin:0;padding:0;list-style:none;counter-reset:q}
.qs li{counter-increment:q;position:relative;padding:12px 0 12px 44px;border-bottom:1px solid var(--rule-soft);font-size:18px;max-width:66ch}
.qs li::before{content:counter(q);position:absolute;left:0;top:10px;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--branch);color:var(--branch);font-family:var(--sans);font-size:13.5px;font-weight:600;display:grid;place-items:center}
dl.appr{margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
dl.appr div{background:var(--surface);border:1px solid var(--rule);border-left:3px solid var(--branch);border-radius:4px;padding:14px 16px}
dl.appr dt{font-weight:600;font-size:18px;margin-bottom:4px}
dl.appr dd{margin:0;color:var(--ink-2);font-size:16px;line-height:1.55}
.vnbox{background:var(--surface);border:1px solid var(--rule);border-radius:4px;padding:18px 22px;max-width:70ch}
.vnbox p{margin:0;line-height:1.7}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:0 0 48px}
.pager a{display:block;padding:14px 16px;border:1px solid var(--rule);border-radius:4px;background:var(--surface);text-decoration:none;color:var(--ink);font-weight:600}
.pager a:hover{border-color:var(--branch)}
.pager a.nx{text-align:right}
.pager small{display:block;font-family:var(--sans);font-weight:400;font-size:12.5px;color:var(--ink-3);margin-bottom:2px}
section.blk>h2 .up{margin-left:auto;font-family:var(--sans);font-size:14px;font-weight:400;text-decoration:none}
.siblings{list-style:none;padding:0;margin:0;columns:2 260px;column-gap:32px}
.siblings li{break-inside:avoid;padding:6px 0;border-bottom:1px solid var(--rule-soft)}
.siblings a{text-decoration:none;color:var(--ink)}
.siblings a.cur{font-weight:600;color:var(--branch)}
.siblings .c{font-family:var(--sans);font-size:13px;color:var(--ink-3);margin-right:8px}

/* glossary & search page */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 26px;font-family:var(--sans);font-size:14px}
.chip{border:1px solid var(--rule);background:var(--surface);border-radius:20px;padding:5px 14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.letters{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:24px;font-family:var(--sans);font-size:14px}
.letters a{min-width:30px;text-align:center;padding:3px 0;border:1px solid var(--rule-soft);border-radius:4px;text-decoration:none;color:var(--ink-2)}
.gl-group{margin-bottom:28px;scroll-margin-top:calc(var(--top) + 20px)}
.gl-group h3{font-size:30px;margin:0 0 4px;color:var(--ink-3);font-weight:400;border-bottom:1px solid var(--rule);padding-bottom:4px}
.gl-tag{font-family:var(--sans);font-size:12.5px;text-decoration:none;color:var(--bc);border:1px solid currentColor;border-radius:3px;padding:0 6px;margin-left:8px;white-space:nowrap}
.sr-list{list-style:none;margin:0;padding:0}
.sr-list li{padding:14px 0;border-bottom:1px solid var(--rule-soft)}
.sr-list a{font-weight:600;font-size:19px;text-decoration:none}
.sr-list small{display:block;font-family:var(--sans);color:var(--ink-3);font-size:13px}
.sr-list p{margin:4px 0 0;color:var(--ink-2);font-size:16px}
mark{background:#FDE9A8;color:inherit;padding:0 1px}
[data-theme="dark"] mark{background:#5A4A12}

footer{margin-top:60px;padding-top:18px;border-top:1px solid var(--rule);font-family:var(--sans);font-size:13px;color:var(--ink-3)}

/* ---------- responsive ---------- */
@media (max-width:1180px){.layout{grid-template-columns:1fr}.toc{display:none}}
@media (max-width:900px){
  body{font-size:17px}
  .menu-btn{display:inline-block}
  .brand span{display:none}
  .side{transform:translateX(-100%);transition:transform .2s ease;width:min(86vw,320px);box-shadow:none}
  body.drawer .side{transform:none;box-shadow:0 0 40px rgba(0,0,0,.25)}
  body.drawer .scrim{display:block;position:fixed;inset:var(--top) 0 0 0;background:rgba(10,15,25,.35);z-index:15}
  main{margin-left:0;padding:calc(var(--top) + 20px) 20px 60px}
  .masthead{grid-template-columns:1fr;gap:8px}
  .branch-list a{grid-template-columns:56px 1fr;gap:14px}
  .branch-list .bc{font-size:30px}
  .branch-list .meta{display:none}
  .tl::before{left:6px}
  .tl li{grid-template-columns:1fr;padding-left:30px}
  .tl li::after{left:1px}
  .tl time{text-align:left;padding:0 0 2px}
  .people td:nth-child(2),.people td:first-child{white-space:normal}
}
@media (max-width:560px){
  .pager{grid-template-columns:1fr}
  .pager a.nx{text-align:left}
  .top{gap:8px;padding:0 10px}
  .brand{display:none}
  .search{max-width:none}
  .search input{font-size:15px}
  .theme-btn{padding:6px 8px;font-size:13px}
  .theme-btn .long{display:none}
  .people thead{display:none}
  .people tr{display:block;padding:10px 0;border-bottom:1px solid var(--rule-soft)}
  .people td{display:block;border:0;padding:1px 0}
}
@media print{.top,.side,.toc,.back{display:none}main{margin:0;padding:0}}
</style>
</head>
<body>
<header class="top">
  <button class="menu-btn" id="menuBtn" aria-controls="side" aria-expanded="false">Mục lục</button>
  <a class="brand" href="#/"><b>Bản đồ tri thức</b><span>Cổng tri thức tiếng Việt</span></a>
  <div class="search" role="search">
    <input id="q" type="search" autocomplete="off" placeholder="Tìm chủ đề, nhân vật, khái niệm" aria-label="Tìm kiếm" aria-controls="results">
    <div class="results" id="results" role="listbox"></div>
  </div>
  <button class="theme-btn" id="themeBtn" aria-label="Đổi giao diện sáng hoặc tối"><span class="long">Giao diện </span><span id="themeLbl">tối</span></button>
</header>
<nav class="side" id="side" aria-label="Cây tri thức">
  <h2>Cây tri thức</h2>
  <ul class="tree" id="tree"></ul>
  <div class="extra"><ul class="tree"><li><div class="row"><span class="tog ph"></span><a class="node" href="#/glossary" data-code="glossary"><span class="c"></span>Thuật ngữ A–Z</a></div></li></ul></div>
</nav>
<div class="scrim" id="scrim"></div>
<main id="main" tabindex="-1"><div class="wrap" id="view"></div></main>

<script>
(function(){
"use strict";
const T = KNOWLEDGE_TREE;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
/* đánh dấu [cần kiểm chứng] thành nhãn nhỏ */
const rich = s => esc(s).replace(/\[cần kiểm chứng\]/g, '<span class="uncertain" title="Thông tin cần đối chiếu thêm nguồn">cần kiểm chứng</span>');
const norm = s => String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D").toLowerCase();

/* ---------- index ---------- */
const byCode = new Map(), parent = new Map();
(function walk(n, p){ byCode.set(n.code, n); if(p) parent.set(n.code, p);
  (n.children||[]).forEach(c => walk(c, n)); })(T, null);
const branchOf = n => { let x = n; while(x && x.level > 2) x = parent.get(x.code); return x && x.level===2 ? x : null; };
const colorOf = n => (branchOf(n)||{}).color || "var(--accent)";
const lineage = n => { const a=[]; let x=n; while(x){ a.unshift(x); x=parent.get(x.code);} return a; };
const href = code => code ? "#/" + code : "#/";

/* ---------- search index ---------- */
const IDX = [];
byCode.forEach(n => { if(n.level===0) return;
  IDX.push({type:"Chủ đề", title:n.title_vi, sub:(n.code+"  "+(n.title_en||"")), text:n.summary, href:href(n.code), code:n.code});
  const s = n.sections||{};
  (s.figures||[]).forEach(f => IDX.push({type:"Nhân vật", title:f.name, sub:n.code+" "+n.title_vi+", "+f.years, text:f.contribution, href:href(n.code)+"?s=figures", code:n.code}));
  (s.concepts||[]).forEach(c => IDX.push({type:"Khái niệm", title:c.term_vi, sub:n.code+" "+n.title_vi+", "+c.term_en, text:c.definition, href:href(n.code)+"?s=concepts", code:n.code}));
  (s.approaches||[]).forEach(a => IDX.push({type:"Trường phái", title:a.name, sub:n.code+" "+n.title_vi, text:a.desc, href:href(n.code)+"?s=approaches", code:n.code}));
  (s.timeline||[]).forEach(t => IDX.push({type:"Mốc thời gian", title:t.time, sub:n.title_vi, text:t.event, href:href(n.code)+"?s=timeline", code:n.code}));
  (s.readings||[]).forEach(r => IDX.push({type:"Tác phẩm", title:r.title, sub:n.title_vi+", "+r.author, text:r.note, href:href(n.code)+"?s=readings", code:n.code}));
});
IDX.forEach(i => { i._t = norm(i.title); i._all = norm(i.title+" "+i.sub+" "+i.text); });
function search(q){
  const t = norm(q).trim(); if(!t) return [];
  const words = t.split(/\s+/);
  const phrase = IDX.some(i => i._all.includes(t));
  return IDX.map(i => {
    if(phrase ? !i._all.includes(t) : !words.every(w => i._all.includes(w))) return null;
    let sc = 0; if(i._t===t) sc+=100; if(i._t.startsWith(t)) sc+=40; if(i._t.includes(t)) sc+=20;
    if(i.type==="Chủ đề") sc+=5; return [sc,i];
  }).filter(Boolean).sort((a,b)=>b[0]-a[0]).map(x=>x[1]);
}
function markHit(text, q){
  const t = norm(q).trim(); if(!t) return esc(text);
  const n = norm(text); const k = n.indexOf(t);
  if(k<0) return esc(text);
  return esc(text.slice(0,k)) + "<mark>" + esc(text.slice(k,k+t.length)) + "</mark>" + esc(text.slice(k+t.length));
}

/* ---------- sidebar tree ---------- */
const open = new Set();
const chev = '<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M3 1.5 6.8 5 3 8.5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>';
function treeHTML(nodes){
  return nodes.map(n => {
    const kids = n.children||[]; const isOpen = open.has(n.code);
    return `<li><div class="row">${kids.length ? `<button class="tog" data-tog="${esc(n.code)}" aria-expanded="${isOpen}" aria-label="Mở rộng ${esc(n.title_vi)}">${chev}</button>` : '<span class="tog ph"></span>'}
      <a class="node" href="${href(n.code)}" data-code="${esc(n.code)}"><span class="c">${esc(n.code)}</span>${esc(n.title_vi)}</a></div>
      ${kids.length && isOpen ? `<ul>${treeHTML(kids)}</ul>` : ""}</li>`;
  }).join("");
}
function renderTree(cur){
  $("#tree").innerHTML = treeHTML(T.children);
  document.querySelectorAll(".node").forEach(a => {
    const on = a.dataset.code === cur; a.classList.toggle("cur", on);
    if(on) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current");
  });
}
$("#tree").addEventListener("click", e => {
  const b = e.target.closest("[data-tog]"); if(!b) return;
  const c = b.dataset.tog; open.has(c) ? open.delete(c) : open.add(c); renderTree(currentCode);
});

/* ---------- views ---------- */
function crumbs(n){
  const parts = lineage(n).map((x,i,a) => i===a.length-1
    ? `<span aria-current="page">${esc(x.level? x.code+" "+x.title_vi : x.title_vi)}</span>`
    : `<a href="${href(x.code)}">${esc(x.level? x.code+" "+x.title_vi : x.title_vi)}</a>`);
  return `<nav class="crumbs" aria-label="Đường dẫn">${parts.join('<span class="sep">/</span>')}${n.level? '<button class="back" data-back>Quay lại</button>':''}</nav>`;
}
const foot = () => `<footer>Nội dung ở mức nhập môn, phục vụ tự học. Các mục gắn nhãn <span class="uncertain">cần kiểm chứng</span> là thông tin còn tranh luận hoặc cần đối chiếu thêm nguồn. Ở mục tác phẩm, nhãn Tên dịch nghĩa cho biết chưa xác minh được bản dịch tiếng Việt đã xuất bản; tên gốc ghi trong ngoặc.</footer>`;
function countStats(n){
  const s=n.sections||{}; return `${(n.children||[]).length} chuyên ngành, ${(s.figures||[]).length} nhân vật, ${(s.concepts||[]).length} khái niệm`;
}
function listOfNodes(nodes){
  return `<ul class="branch-list">${nodes.map(b => `<li><a href="${href(b.code)}" style="--bc:${b.color||'var(--accent)'}">
    <span class="bc">${esc(b.code)}</span>
    <div><h3>${esc(b.title_vi)}<small>${esc(b.title_en)}</small></h3><p>${esc(b.summary||"Nội dung đang được xây dựng.")}</p></div>
    <span class="meta">${b.level===2? countStats(b) : (b.children||[]).length+" phân ngành"}</span></a></li>`).join("")}</ul>`;
}

function viewRoot(){
  return `<div class="masthead solo" style="--branch:var(--accent)">
    <div><h1>${esc(T.title_vi)}</h1><p class="en">${esc(T.title_en)}</p><p class="lede">${esc(T.summary)} Chọn một nhánh để bắt đầu, hoặc dùng ô tìm kiếm phía trên.</p></div></div>
    ${listOfNodes(T.children)}${foot()}`;
}
function viewL1(n){
  const body = (n.children||[]).length ? listOfNodes(n.children)
    : `<p class="notice">Nhánh ${esc(n.code)} chưa có phân ngành. Bổ sung node level 2 vào mảng <code>children</code> của nhánh này trong KNOWLEDGE_TREE để hiển thị tại đây.</p>`;
  return `${crumbs(n)}<div class="masthead"><span class="code-mark">${esc(n.code)}.</span>
    <div><h1>${esc(n.title_vi)}</h1><p class="en">${esc(n.title_en)}</p>${n.summary? `<p class="lede">${esc(n.summary)}</p>`:""}</div></div>${body}${foot()}`;
}
const SECTIONS = [
  ["definition","Định nghĩa và phạm vi"],["subfields","Các chuyên ngành"],["timeline","Tiến trình phát triển"],
  ["figures","Nhân vật tiêu biểu"],["concepts","Khái niệm cốt lõi"],["readings","Tác phẩm nên đọc"],["links","Liên kết liên ngành"]
];
function viewL2(n){
  const s = n.sections||{};
  const blk = {
    definition: () => `<div class="prose">${(s.definition||[]).map(p=>`<p>${rich(p)}</p>`).join("")}</div>`,
    subfields: () => `<ul class="sub">${(n.children||[]).map(c=>`<li><span class="c">${esc(c.code)}</span><a href="${href(c.code)}">${esc(c.title_vi)}</a><span class="en">${esc(c.title_en)}</span><p>${rich(c.summary)}</p></li>`).join("")}</ul>`,
    timeline: () => `<ol class="tl">${(s.timeline||[]).map(t=>`<li><time>${rich(t.time)}</time><p>${rich(t.event)}</p></li>`).join("")}</ol>`,
    figures: () => `<table class="people"><thead><tr><th scope="col">Nhân vật</th><th scope="col">Niên đại</th><th scope="col">Đóng góp chính</th></tr></thead><tbody>${(s.figures||[]).map(f=>`<tr><td>${esc(f.name)}</td><td>${rich(f.years)}</td><td>${rich(f.contribution)}</td></tr>`).join("")}</tbody></table>`,
    concepts: () => `<dl class="terms">${(s.concepts||[]).map(c=>`<div><dt>${esc(c.term_vi)}<span>${esc(c.term_en)}</span></dt><dd>${rich(c.definition)}</dd></div>`).join("")}</dl>`,
    readings: () => readingsHTML(s.readings),
    links: () => `<ul class="xlinks">${(s.links||[]).map(l=>{const t=byCode.get(l.code); if(!t) return ""; return `<li><a href="${href(t.code)}" style="--bc:${t.color}"><b><span class="c">${esc(t.code)}</span>${esc(t.title_vi)}</b><span>${rich(l.note)}</span></a></li>`}).join("")}</ul>`
  };
  const present = SECTIONS.filter(([k]) => k==="subfields" ? (n.children||[]).length : (s[k]||[]).length);
  return `${crumbs(n)}<div class="masthead"><span class="code-mark">${esc(n.code)}</span>
    <div><h1>${esc(n.title_vi)}</h1><p class="en">${esc(n.title_en)}</p><p class="lede">${esc(n.summary)}</p></div></div>
    <div class="layout"><div>${present.map(([k,t],i)=>`<section class="blk" id="s-${k}"><h2><span class="n">${i+1}</span>${t}</h2>${blk[k]()}</section>`).join("")}${foot()}</div>
    <aside class="toc" aria-label="Trong trang này"><h2>Trong trang này</h2><ol>${present.map(([k,t])=>`<li><a href="#/${esc(n.code)}?s=${k}">${t}</a></li>`).join("")}</ol></aside></div>`;
}
const L3_SECTIONS = [["definition","Tổng quan"],["questions","Câu hỏi trung tâm"],["approaches","Trường phái và cách tiếp cận"],
  ["concepts","Khái niệm then chốt"],["figures","Nhân vật tiêu biểu"],["vietnam","Liên hệ Việt Nam"],["readings","Đọc thêm"]];
function readingsHTML(list){
  return `<ul class="books">${(list||[]).map(r=>`<li><cite>${esc(r.title)}</cite> <span class="by">của ${esc(r.author)}</span>, <span class="yr">${rich(r.year)}</span>${r.note?`<p>${rich(r.note)}</p>`:""}${r.vn_status?`<br><span class="vn ${/^(Bản dịch|Có bản dịch|Nguyên bản)/.test(r.vn_status)?"ok":"lit"}">${esc(r.vn_status)}</span>`:""}</li>`).join("")}</ul>`;
}
function viewL3(n){
  const p = parent.get(n.code), s = n.sections||{};
  const sibs = p.children||[], idx = sibs.findIndex(c=>c.code===n.code);
  const prev = sibs[idx-1], next = sibs[idx+1];
  const blk = {
    definition: () => `<div class="prose">${(s.definition||[]).map(x=>`<p>${rich(x)}</p>`).join("")}</div>`,
    questions: () => `<ol class="qs">${(s.questions||[]).map(q=>`<li>${rich(q)}</li>`).join("")}</ol>`,
    approaches: () => `<dl class="appr">${(s.approaches||[]).map(a=>`<div><dt>${esc(a.name)}</dt><dd>${rich(a.desc)}</dd></div>`).join("")}</dl>`,
    concepts: () => `<dl class="terms">${(s.concepts||[]).map(c=>`<div><dt>${esc(c.term_vi)}<span>${esc(c.term_en)}</span></dt><dd>${rich(c.definition)}</dd></div>`).join("")}</dl>`,
    figures: () => `<table class="people"><thead><tr><th scope="col">Nhân vật</th><th scope="col">Niên đại</th><th scope="col">Đóng góp chính</th></tr></thead><tbody>${(s.figures||[]).map(f=>`<tr><td>${esc(f.name)}</td><td>${rich(f.years)}</td><td>${rich(f.contribution)}</td></tr>`).join("")}</tbody></table>`,
    vietnam: () => `<div class="vnbox"><p>${rich(s.vietnam)}</p></div>`,
    readings: () => readingsHTML(s.readings)
  };
  const present = L3_SECTIONS.filter(([k]) => k==="vietnam" ? !!s.vietnam : (s[k]||[]).length);
  const body = present.length
    ? present.map(([k,t],i)=>`<section class="blk" id="s-${k}"><h2><span class="n">${i+1}</span>${t}</h2>${blk[k]()}</section>`).join("")
    : `<p class="notice">Nội dung chi tiết của chủ đề này đang được xây dựng. Xem tổng quan tại trang <a href="${href(p.code)}">${esc(p.code)} ${esc(p.title_vi)}</a>.</p>`;
  const pager = `<nav class="pager" aria-label="Chủ đề liền kề">${prev?`<a href="${href(prev.code)}"><small>Chủ đề trước</small>${esc(prev.code)} ${esc(prev.title_vi)}</a>`:"<span></span>"}${next?`<a class="nx" href="${href(next.code)}"><small>Chủ đề tiếp theo</small>${esc(next.code)} ${esc(next.title_vi)}</a>`:"<span></span>"}</nav>`;
  return `${crumbs(n)}<div class="masthead"><span class="code-mark">${esc(n.code)}</span>
    <div><h1>${esc(n.title_vi)}</h1><p class="en">${esc(n.title_en)}</p><p class="lede">${rich(n.summary)}</p></div></div>
    <div class="layout"><div>${body}${pager}
    <section class="blk"><h2>Các chủ đề cùng phân ngành <a class="up" href="${href(p.code)}">${esc(p.code)} ${esc(p.title_vi)}</a></h2><ul class="siblings">${sibs.map(c=>`<li><a href="${href(c.code)}" class="${c.code===n.code?'cur':''}"><span class="c">${esc(c.code)}</span>${esc(c.title_vi)}</a></li>`).join("")}</ul></section>${foot()}</div>
    ${present.length?`<aside class="toc" aria-label="Trong trang này"><h2>Trong trang này</h2><ol>${present.map(([k,t])=>`<li><a href="#/${esc(n.code)}?s=${k}">${t}</a></li>`).join("")}</ol></aside>`:""}</div>`;
}

let glFilter = "all";
function viewGlossary(){
  const branches = []; byCode.forEach(n => { if(n.level===2) branches.push(n); });
  let items = [];
  branches.forEach(b => {
    (b.sections.concepts||[]).forEach(c => items.push({...c, b, src:b}));
    (b.children||[]).forEach(t => ((t.sections||{}).concepts||[]).forEach(c => items.push({...c, b, src:t})));
  });
  if(glFilter!=="all") items = items.filter(i => i.b.code===glFilter);
  items.sort((a,b)=>a.term_vi.localeCompare(b.term_vi,"vi"));
  const groups = new Map();
  items.forEach(i => { const L = norm(i.term_vi).charAt(0).toUpperCase(); if(!groups.has(L)) groups.set(L,[]); groups.get(L).push(i); });
  const chips = [["all","Tất cả"], ...branches.map(b=>[b.code,b.title_vi])].map(([c,t])=>`<button class="chip" data-gl="${esc(c)}" aria-pressed="${glFilter===c}">${esc(t)}</button>`).join("");
  return `<nav class="crumbs"><a href="#/">${esc(T.title_vi)}</a><span class="sep">/</span><span>Thuật ngữ A–Z</span><button class="back" data-back>Quay lại</button></nav>
   <div class="masthead"><span class="code-mark">A–Z</span><div><h1>Thuật ngữ</h1><p class="en">Glossary</p><p class="lede">${items.length} khái niệm từ các phân ngành và chủ đề, sắp xếp theo thứ tự chữ cái tiếng Việt.</p></div></div>
   <div class="filters" role="group" aria-label="Lọc theo phân ngành">${chips}</div>
   <div class="letters">${[...groups.keys()].map(L=>`<a href="#/glossary?s=${L}">${L}</a>`).join("")}</div>
   ${[...groups].map(([L,arr])=>`<div class="gl-group" id="s-${L}"><h3>${L}</h3><dl class="terms">${arr.map(i=>`<div><dt>${esc(i.term_vi)}<span>${esc(i.term_en)}</span><a class="gl-tag" style="--bc:${i.b.color}" href="${href(i.src.code)}?s=concepts">${esc(i.src.code)} ${esc(i.src.title_vi)}</a></dt><dd>${rich(i.definition)}</dd></div>`).join("")}</dl></div>`).join("")}${foot()}`;
}
function viewSearch(q){
  const r = search(q);
  return `<nav class="crumbs"><a href="#/">${esc(T.title_vi)}</a><span class="sep">/</span><span>Kết quả tìm kiếm</span><button class="back" data-back>Quay lại</button></nav>
   <div class="masthead solo"><div><h1>Kết quả cho “${esc(q)}”</h1><p class="lede">${r.length ? r.length+" kết quả." : "Không có kết quả. Thử từ khóa ngắn hơn, hoặc gõ không dấu, ví dụ: hien sinh."}</p></div></div>
   <ul class="sr-list">${r.map(i=>`<li><small>${esc(i.type)}, ${esc(i.sub)}</small><a href="${i.href}">${markHit(i.title,q)}</a><p>${rich(i.text)}</p></li>`).join("")}</ul>${foot()}`;
}
function viewMissing(code){
  return `<div class="masthead"><span class="code-mark">404</span><div><h1>Không tìm thấy mục ${esc(code)}</h1><p class="lede">Mã này không có trong cây tri thức. <a href="#/">Về trang chủ</a> hoặc chọn một mục ở cây bên trái.</p></div></div>`;
}

/* ---------- router ---------- */
let currentCode = "";
function route(){
  const raw = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
  const [path, qs] = raw.split("?"); const params = new URLSearchParams(qs||"");
  const view = $("#view"); let n = null;
  if(path==="glossary"){ currentCode="glossary"; view.innerHTML = viewGlossary(); document.documentElement.style.setProperty("--branch","var(--accent)"); document.title="Thuật ngữ A–Z | Bản đồ tri thức"; }
  else if(path==="search"){ currentCode=""; view.innerHTML = viewSearch(params.get("q")||""); document.documentElement.style.setProperty("--branch","var(--accent)"); document.title="Tìm kiếm | Bản đồ tri thức"; }
  else {
    n = byCode.get(path||"");
    currentCode = n ? n.code : "";
    if(!n){ view.innerHTML = viewMissing(path); }
    else {
      document.documentElement.style.setProperty("--branch", n.level>=2 ? colorOf(n) : "var(--accent)");
      view.innerHTML = n.level===0 ? viewRoot() : n.level===1 ? viewL1(n) : n.level===2 ? viewL2(n) : viewL3(n);
      document.title = (n.level ? n.code+" "+n.title_vi+" | " : "") + "Bản đồ tri thức";
      open.clear(); lineage(n).forEach(x => { if(x.level && (x.children||[]).length) open.add(x.code); });
    }
  }
  renderTree(currentCode);
  closeDrawer(); closeResults();
  const s = params.get("s");
  const target = s && document.getElementById("s-"+s);
  if(target){ target.scrollIntoView({behavior:"instant", block:"start"}); } else window.scrollTo({top:0, behavior:"instant"});
  if(!s) $("#main").focus({preventScroll:true});
}
window.addEventListener("hashchange", route);
document.addEventListener("click", e => {
  if(e.target.closest("[data-back]")){ history.length>1 ? history.back() : (location.hash="#/"); }
  const g = e.target.closest("[data-gl]"); if(g){ glFilter = g.dataset.gl; route(); }
});

/* ---------- live search ---------- */
const q = $("#q"), res = $("#results"); let sel = -1, hits = [];
function closeResults(){ res.classList.remove("open"); sel=-1; }
function drawResults(){
  hits = search(q.value).slice(0,8);
  if(!q.value.trim()){ closeResults(); return; }
  res.innerHTML = hits.length ? hits.map((i,k)=>`<a href="${i.href}" role="option" class="${k===sel?'sel':''}">${markHit(i.title,q.value)}<small>${esc(i.type)}, ${esc(i.sub)}</small></a>`).join("")
    + `<a href="#/search?q=${encodeURIComponent(q.value)}"><small>Xem tất cả kết quả</small></a>`
    : `<div class="empty">Không có kết quả cho “${esc(q.value)}”.</div>`;
  res.classList.add("open");
}
q.addEventListener("input", () => { sel=-1; drawResults(); });
q.addEventListener("keydown", e => {
  if(e.key==="ArrowDown"){ e.preventDefault(); sel=Math.min(sel+1,hits.length-1); drawResults(); }
  else if(e.key==="ArrowUp"){ e.preventDefault(); sel=Math.max(sel-1,-1); drawResults(); }
  else if(e.key==="Enter"){ e.preventDefault(); location.hash = sel>=0 ? hits[sel].href.slice(1) : "/search?q="+encodeURIComponent(q.value); q.blur(); }
  else if(e.key==="Escape"){ closeResults(); }
});
document.addEventListener("click", e => { if(!e.target.closest(".search")) closeResults(); });
document.addEventListener("keydown", e => { if(e.key==="/" && document.activeElement!==q){ e.preventDefault(); q.focus(); } });

/* ---------- drawer & theme ---------- */
function closeDrawer(){ document.body.classList.remove("drawer"); $("#menuBtn").setAttribute("aria-expanded","false"); }
$("#menuBtn").addEventListener("click", () => { const o = document.body.classList.toggle("drawer"); $("#menuBtn").setAttribute("aria-expanded", o); });
$("#scrim").addEventListener("click", closeDrawer);
const setTheme = t => { document.documentElement.dataset.theme = t; $("#themeLbl").textContent = t==="dark" ? "sáng" : "tối"; };
setTheme(matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
$("#themeBtn").addEventListener("click", () => setTheme(document.documentElement.dataset.theme==="dark" ? "light" : "dark"));

route();
})();
</script>
</body>
